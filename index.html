<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RUN</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header><div><small>PERSONAL RUNNING</small><h1>RUN</h1></div><button id="historyBtn" class="mini">履歴</button></header>

<section id="setup" class="panel">
<h2>ランニング設定</h2>
<div class="tabs">
<button class="tab active" data-mode="free">フリー</button>
<button class="tab" data-mode="distance">距離</button>
<button class="tab" data-mode="time">時間</button>
</div>
<div id="distanceSet" class="setting hidden">
<span>目標距離</span><div class="step"><button id="dMinus">−</button><b><i id="dValue">5.0</i> km</b><button id="dPlus">＋</button></div><small>0.1 km単位</small>
</div>
<div id="timeSet" class="setting hidden">
<span>目標時間</span><div class="step"><button id="tMinus">−</button><b><i id="tValue">30</i> 分</b><button id="tPlus">＋</button></div>
</div>
<button id="startBtn" class="primary">START</button>
</section>

<section id="run" class="panel hidden">
<div class="status"><span id="gpsStatus">GPS準備中</span><span id="accuracy">精度 -- m</span></div>
<div class="distance"><small>距離</small><div><strong id="distance">0.00</strong> <span>km</span></div></div>
<div id="timer" class="timer">00:00:00</div>
<div class="metrics">
<div><small>現在ペース</small><b id="currentPace">--'--"</b><span>/km</span></div>
<div><small>平均ペース</small><b id="avgPace">--'--"</b><span>/km</span></div>
</div>
<div class="progress"><div><span id="progressLabel">フリーラン</span><b id="progressText">--</b></div><div class="track"><div id="bar"></div></div></div>

<div class="sectionHead"><div><small>LIVE ROUTE</small><h3>走行ルート</h3></div><button id="recenter" class="mini">現在地</button></div>
<div id="runMap" class="map"></div>

<div class="sectionHead"><div><small>LAPS</small><h3>1 kmラップ</h3></div><b id="lapCount">0</b></div>
<div id="liveLaps" class="laps"><p>1 km通過後に表示されます。</p></div>

<div class="actions"><button id="pauseBtn" class="secondary">一時停止</button><button id="stopBtn" class="danger">終了</button></div>
</section>

<section class="summary"><div><small>今週</small><b id="weekKm">0.0 km</b></div><div><small>今月</small><b id="monthKm">0.0 km</b></div></section>
</main>

<dialog id="resultDialog"><div class="dialogBody"><small>RUN COMPLETE</small><h2>ランニング結果</h2>
<div class="results"><div><span>距離</span><b id="rDistance"></b></div><div><span>時間</span><b id="rTime"></b></div><div><span>平均ペース</span><b id="rPace"></b></div></div>
<h3>走ったルート</h3><div id="resultMap" class="map resultMap"></div>
<h3>1 kmラップ</h3><div id="resultLaps" class="laps"></div>
<button id="closeResult" class="primary">保存して閉じる</button></div></dialog>

<dialog id="historyDialog"><div class="dialogBody"><div class="dialogTop"><div><small>HISTORY</small><h2>ランニング履歴</h2></div><button id="closeHistory" class="mini">閉じる</button></div><div id="historyList"></div><button id="clearHistory" class="secondary wide">履歴をすべて削除</button></div></dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
